name: Update Profile Cards

on:
schedule:
- cron: "17 3 * * *"
workflow_dispatch:

jobs:
generate:
name: Generate GitHub profile cards
runs-on: ubuntu-latest

permissions:
  contents: write

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Create profile directory
    run: mkdir -p profile

  - name: Generate GitHub statistics
    uses: stats-organization/github-readme-stats-action@v2
    with:
      card: stats
      options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&hide_border=true&bg_color=0D1117&title_color=F5B642&icon_color=F5B642&text_color=FFFFFF&rank_icon=github
      path: profile/stats.svg
      token: ${{ secrets.GITHUB_TOKEN }}

  - name: Generate top languages
    uses: stats-organization/github-readme-stats-action@v2
    with:
      card: top-langs
      options: username=${{ github.repository_owner }}&layout=compact&langs_count=10&hide_border=true&bg_color=0D1117&title_color=F5B642&text_color=FFFFFF
      path: profile/top-langs.svg
      token: ${{ secrets.GITHUB_TOKEN }}

  - name: Generate MicroLab Pro card
    uses: stats-organization/github-readme-stats-action@v2
    with:
      card: pin
      options: username=${{ github.repository_owner }}&repo=MicroLabPro&theme=dark&hide_border=true&bg_color=0D1117&title_color=F5B642
      path: profile/microlabpro.svg
      token: ${{ secrets.GITHUB_TOKEN }}

  - name: Generate Microbial Odyssey card
    uses: stats-organization/github-readme-stats-action@v2
    with:
      card: pin
      options: username=${{ github.repository_owner }}&repo=MicroOdyssey&theme=dark&hide_border=true&bg_color=0D1117&title_color=F5B642
      path: profile/microodyssey.svg
      token: ${{ secrets.GITHUB_TOKEN }}

  - name: Generate MicroVerse card
    uses: stats-organization/github-readme-stats-action@v2
    with:
      card: pin
      options: username=${{ github.repository_owner }}&repo=MicroVerse&theme=dark&hide_border=true&bg_color=0D1117&title_color=F5B642
      path: profile/microverse.svg
      token: ${{ secrets.GITHUB_TOKEN }}

  - name: Generate LabPrep DZ card
    uses: stats-organization/github-readme-stats-action@v2
    with:
      card: pin
      options: username=${{ github.repository_owner }}&repo=LabPrepDz&theme=dark&hide_border=true&bg_color=0D1117&title_color=F5B642
      path: profile/labprepdz.svg
      token: ${{ secrets.GITHUB_TOKEN }}

  - name: Generate GitHub trophies
    uses: soulteary/github-profile-trophy-action@v1.0.0
    with:
      options: username=${{ github.repository_owner }}&theme=darkhub&no-frame=true&no-bg=true&margin-w=8&column=7
      path: profile/trophy.svg
      token: ${{ secrets.GITHUB_TOKEN }}

  - name: Commit generated cards
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add profile/*.svg

      git diff --cached --quiet && exit 0

      git commit -m "chore: update profile cards"
      git push
